name: FieldPartner
options:
  bundleIdPrefix: com.ironrim
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
packages:
  MWDAT:
    url: https://github.com/meta/meta-wearables-dat-ios
    exactVersion: 1.1.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.19.0
targets:
  FieldPartner:
    type: application
    platform: iOS
    sources:
      - path: FieldPartner
        excludes:
          - "**/*.md"
          - "**/*.entitlements"
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATMockDevice
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FP_BUNDLE_ID)
        PRODUCT_NAME: FieldPartner
        INFOPLIST_FILE: FieldPartner/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Glasses Wi-Fi video needs the Hotspot entitlement, which only paid Apple teams can sign.
        # Set FP_ENTITLEMENTS in Config/Local.xcconfig once you have the $99 account; empty for a free team.
        CODE_SIGN_ENTITLEMENTS: $(FP_ENTITLEMENTS)
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
  FieldPartnerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FieldPartnerTests]
    dependencies:
      - target: FieldPartner
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FieldPartner:
    build:
      targets:
        FieldPartner: all
        FieldPartnerTests: [test]
    test:
      targets: [FieldPartnerTests]
