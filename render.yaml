# One-click hosting on Render (render.com): Dashboard > New > Blueprint > pick this repo.
# Creates: the API (with a disk for recordings), the AI agent worker, Postgres, and the expert portal.
# Secrets marked "sync: false" are asked for once in the Render dashboard. Never commit them.
databases:
  - name: fieldpartner-db
    plan: basic-256mb
    databaseName: fieldpartner
    user: fieldpartner

services:
  - type: web
    name: fieldpartner-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass # deploy only after GitHub CI passes on main
    disk:
      name: media
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: fieldpartner-db, property: connectionString }
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_SERVICE_TOKEN
        generateValue: true
      - key: PUBLIC_API_URL # your API address, e.g. https://fieldpartner-api.onrender.com
        sync: false
      - key: PORTAL_URL # your portal address, e.g. https://fieldpartner-portal.onrender.com
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY # Claude: senior expert answers, reports, lessons (console.anthropic.com)
        sync: false
      - key: CLAUDE_MODEL # senior model: safety questions, failed fixes, hard visits ($2/$10 per 1M tokens)
        value: claude-sonnet-5-5
      - key: CLAUDE_FAST_MODEL # fast model: routine questions, nameplates, routine reports ($0.10/$0.50)
        value: claude-haiku-5-5
      - key: AI_MONTHLY_BUDGET_USD # per company per month; past it everything uses the fast model. 0 = no cap
        value: "100"
      - key: SIGNUP_ENABLED # set to false once your companies are created
        value: "true"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

  - type: worker
    name: fieldpartner-agent
    runtime: docker
    dockerfilePath: ./agent/Dockerfile
    dockerContext: ./agent
    plan: standard # 2 GB. Starter (512 MB) runs out of memory: each live visit needs about 430 MB on top of 210 MB base
    autoDeployTrigger: checksPass # deploy only after GitHub CI passes on main
    envVars:
      - key: AGENT_EXECUTOR # thread = all visits share one process (about 3 at once in 2 GB)
        value: thread
      - key: AGENT_IDLE_PROCESSES
        value: "1"
      # Gemini Live cost controls (it re-bills the whole session context on every turn)
      - key: GEMINI_MEDIA_RESOLUTION # low camera detail; small print goes to read_label instead
        value: low
      - key: GEMINI_VIDEO_FPS # frames per second, only while the assistant is listening
        value: "0.5"
      - key: GEMINI_CONTEXT_TRIGGER_TOKENS # compress the session when it passes this
        value: "12000"
      - key: GEMINI_CONTEXT_TARGET_TOKENS # down to this
        value: "5000"
      - key: SAFETY_STATIC_RECHECK_SECONDS # hazard check on an unchanged view at most this often
        value: "30"
      - key: BACKEND_URL # private network address of the API, no public hop
        fromService: { type: web, name: fieldpartner-api, property: hostport }
      - key: AGENT_SERVICE_TOKEN
        fromService: { type: web, name: fieldpartner-api, envVarKey: AGENT_SERVICE_TOKEN }
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  - type: web
    name: fieldpartner-portal
    runtime: static
    autoDeployTrigger: checksPass
    rootDir: portal
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL # same as PUBLIC_API_URL above
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
