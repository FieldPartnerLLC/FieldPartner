# Builds the iPhone app on GitHub's Mac and uploads it to TestFlight. No Xcode needed on your Mac.
#
# One-time setup (GitHub > repo > Settings > Secrets and variables > Actions > New repository secret):
#   APPLE_TEAM_ID         10-character Team ID (developer.apple.com > Account > Membership details)
#   ASC_KEY_ID            App Store Connect API key ID (appstoreconnect.apple.com > Users and Access > Integrations > Keys)
#   ASC_ISSUER_ID         Issuer ID shown above that keys list
#   ASC_KEY_P8            The full text of the downloaded AuthKey_XXXX.p8 file
# And once in App Store Connect: Apps > + > New App, bundle ID com.ironrim.fieldpartner, name FieldPartner.
#
# Runs on every push to main that touches ios/, and from the Actions tab (Run workflow).
name: iPhone to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-testflight.yml"]

concurrency: { group: testflight, cancel-in-progress: true }

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_KEYS: ${{ secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
      LIVE_API: https://fieldpartner-api.onrender.com
    steps:
      - name: Skip until the Apple keys are added
        if: env.HAS_KEYS != 'true'
        run: echo "::notice::TestFlight upload skipped. Add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets."
      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'
      - name: Generate the Xcode project
        if: env.HAS_KEYS == 'true'
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          brew install xcodegen
          {
            echo "DEVELOPMENT_TEAM = $TEAM"
            echo "FP_BUNDLE_ID = com.ironrim.fieldpartner"
            echo "FP_API_BASE_URL = ${LIVE_API%%://*}:/\$()/${LIVE_API#*://}"
            echo "META_APP_ID = 0"
            echo "CLIENT_TOKEN = 0"
            echo "FP_ENTITLEMENTS = FieldPartner/FieldPartner.entitlements"
          } > Config/Local.xcconfig
          xcodegen generate
      - name: Archive and upload
        if: env.HAS_KEYS == 'true'
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project FieldPartner.xcodeproj -scheme FieldPartner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FieldPartner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}" archive | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FieldPartner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -40
          rm -f "$KEY"
          echo "::notice::Uploaded build ${{ github.run_number }}. It shows in TestFlight after Apple finishes processing (about 10 to 30 minutes)."
